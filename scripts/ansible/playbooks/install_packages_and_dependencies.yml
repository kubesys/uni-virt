---
- name: Install and configure packages
  hosts: master:worker
  become: yes
  vars:
    offline: None

  tasks:
    - name: Set python interpreter for Kylin
      set_fact:
        ansible_python_interpreter: /usr/bin/python3
      when: ansible_os_family == 'Kylin Linux Advanced Server'

    - name: Install required packages (RHEL/CentOS/Kylin/UOS)
      yum:
        name:
          - bzip2
          - wget
          - ca-certificates
        state: present
      when: ansible_os_family == 'RedHat' or ansible_os_family == 'Kylin Linux Advanced Server' or ansible_os_family == 'UOS'

    - name: Install required packages (Ubuntu/Debian)
      apt:
        name:
          - bzip2
          - wget
          - ca-certificates
        state: present
      when: ansible_os_family == 'Debian'

    # ========================= Anaconda 安装 =========================
    - name: Download Anaconda3 installer for x86_64
      get_url:
        url: https://repo.anaconda.com/archive/Anaconda3-2021.11-Linux-x86_64.sh
        dest: /tmp/Anaconda3.sh
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian'] and ansible_machine == 'x86_64') and offline is none

    - name: Download Anaconda3 installer for aarch64
      get_url:
        url: https://mirrors.tuna.tsinghua.edu.cn/github-release/conda-forge/miniforge/Release%2024.7.1-2/Miniforge3-24.7.1-2-Linux-aarch64.sh
        dest: /tmp/Anaconda3.sh
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server'] and ansible_machine == 'aarch64') and offline is none

    - name: Run Anaconda3 installer
      command: bash /tmp/Anaconda3.sh -b -p /opt/anaconda3
      args:
        creates: /opt/anaconda3
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    - name: Add Anaconda3 to PATH
      lineinfile:
        dest: "{{ ansible_env.HOME }}/.bashrc"
        line: 'export PATH=/opt/anaconda3/bin:$PATH'
        create: yes
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    - name: Reload bashrc
      shell: bash -c "source {{ ansible_env.HOME }}/.bashrc"
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    # ========================= Python 安装 =========================
    - name: Install Python 3.9.7 using conda
      shell: /opt/anaconda3/bin/conda install -y python=3.9.7
      ignore_errors: true
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    - name: Install pip for Python 3.9.7
      shell: /opt/anaconda3/bin/python3.9 -m ensurepip
      args:
        creates: /usr/local/bin/pip3.9
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    - name: Create symlink python3.9
      file:
        src: /opt/anaconda3/bin/python
        dest: /usr/local/bin/python3.9
        state: link
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    - name: Create symlink pip3.9
      file:
        src: /opt/anaconda3/bin/pip
        dest: /usr/local/bin/pip3.9
        state: link
        force: yes
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    - name: Create symlink python3
      file:
        src: /opt/anaconda3/bin/python
        dest: /usr/local/bin/python3
        state: link
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    - name: Create symlink pip3
      file:
        src: /opt/anaconda3/bin/pip
        dest: /usr/local/bin/pip3
        state: link
        force: yes
      when: (ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian']) and offline is none

    # ========================= 虚拟化依赖包（全系统支持） =========================
    - name: Install virtualization packages (RHEL/Kylin/UOS)
      yum:
        name:
          - wget
          - cloud-utils
          - usbutils
          - libguestfs-tools-c
          - virt-manager
          - python3-devel
          - libvirt-devel
          - gcc
          - gcc-c++
          - libvirt
          - virt-install
          - qemu-kvm
          - ceph
          - openvswitch
          - jq
        state: present
      when: ansible_os_family == 'RedHat' or ansible_os_family == 'Kylin Linux Advanced Server' or ansible_os_family == 'UOS'

    - name: Install virtualization packages (Ubuntu/Debian)
      apt:
        name:
          - wget
          - cloud-utils
          - usbutils
          - libguestfs-tools
          - virt-manager
          - python3-dev
          - libvirt-dev
          - gcc
          - g++
          - libvirt-daemon-system
          - libvirt-clients
          - virtinst
          - qemu-kvm
          - ceph
          - openvswitch-switch
          - jq
        state: present
      when: ansible_os_family == 'Debian'

    # ========================= Python 依赖 =========================
    - name: Downgrade pip
      pip:
        name: pip<=23.3.2
        executable: pip3
      when: ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian'] and offline is none

    - name: Install Python packages
      pip:
        name:
          - threadpool
          - prometheus_client
          - kubernetes==26.1.0
          - libvirt-python
          - xmljson
          - xmltodict
          - watchdog
          - pyyaml
          - grpcio
          - grpcio-tools
          - protobuf
          - psutil
          - pyinstaller
          - tenacity
          - requests
        state: latest
        executable: pip3
      when: ansible_os_family in ['RedHat', 'Kylin Linux Advanced Server', 'UOS', 'Debian'] and offline is none

    # ========================= 启动服务（全系统通用） =========================
    - name: Enable and start libvirtd
      systemd:
        name: libvirtd
        enabled: yes
        state: started
